services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - "./Agronomist SDK/init.sql:/docker-entrypoint-initdb.d/init.sql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://test:test@db:5432/test_db
      SPREADSHEET_ID: ${SPREADSHEET_ID}
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/service_account.json
    volumes:
      - ./service_account.json:/app/service_account.json:ro
    ports:
      - "8000:8000"
